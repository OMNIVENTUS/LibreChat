      tags:
        - Blocks
      summary: Retrieve a block
      parameters:
        - name: Notion-Version
          in: header
          schema:
            type: string
          example: '{{NOTION_VERSION}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
          example: '{{BLOCK_ID}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              
    delete:
