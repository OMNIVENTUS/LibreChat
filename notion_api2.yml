      description: >-
        This endpoint allows you to update block content. [See Full
        Documentation](https://developers.notion.com/reference/update-a-block)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                paragraph:
                  rich_text:
                    - type: text
                      text:
                        content: hello to you
      parameters:
        - name: Notion-Version
          in: header
          schema:
            type: string
          example: '{{NOTION_VERSION}}'
        - name: id
          in: path
          schema:
            type: string
          required: true
          example: '{{BLOCK_ID}}'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              
